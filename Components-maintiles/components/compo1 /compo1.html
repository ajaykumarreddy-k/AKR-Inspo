<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Portfolio Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#e9e9e9;
      font-family:'Inter',sans-serif;
    }

    .card{
      width:1100px;
      background:#000;
      color:#fff;
      border-radius:22px;
      padding:42px 46px;
      box-shadow:0 20px 60px rgba(0,0,0,0.15);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:70px;
    }

    .name{
      font-size:18px;
      font-weight:500;
      opacity:.9;
    }

    .portfolio{
      font-size:18px;
      font-weight:600;
    }

    .portfolio span{
      opacity:.5;
      font-weight:500;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,0.08);
      padding-bottom:14px;
      transition:.3s ease;
      cursor:pointer;
    }

    .row:last-child{
      border-bottom:none;
      padding-bottom:0;
    }

    .row:hover{
      transform:translateX(8px);
    }

    .title{
      font-size:72px;
      font-weight:700;
      line-height:1;
      letter-spacing:-4px;
    }

    .number{
      font-size:64px;
      font-weight:700;
      color:rgba(255,255,255,0.35);
      letter-spacing:-3px;
    }

    @media(max-width:1200px){
      .card{
        width:90%;
      }

      .title{
        font-size:52px;
      }

      .number{
        font-size:48px;
      }
    }

    @media(max-width:768px){
      .card{
        padding:30px;
      }

      .title{
        font-size:34px;
        letter-spacing:-2px;
      }

      .number{
        font-size:30px;
      }

      .top{
        margin-bottom:45px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="top">
      <div class="name">Name</div>
      <div class="portfolio">Portfolio <span>2025</span></div>
    </div>

    <div class="menu">

      <div class="row">
        <div class="title">About me</div>
        <div class="number">05 — 12</div>
      </div>

      <div class="row">
        <div class="title">Project 1</div>
        <div class="number">17 — 26</div>
      </div>

      <div class="row">
        <div class="title">Project 2</div>
        <div class="number">27 — 35</div>
      </div>

      <div class="row">
        <div class="title">Project 3</div>
        <div class="number">36 — 46</div>
      </div>

      <div class="row">
        <div class="title">Recognition</div>
        <div class="number">47 — 49</div>
      </div>

      <div class="row">
        <div class="title">Contact</div>
        <div class="number">51</div>
      </div>

    </div>

  </div>

</body>
</html>
