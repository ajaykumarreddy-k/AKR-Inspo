<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Press Section</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7e7e7;
    padding:40px;
    font-family:'Inter',sans-serif;
}

.press-card{
    width:100%;
    max-width:1150px;
    background:#000;
    border-radius:8px;
    padding:28px;
    overflow:hidden;
}


/* LAYOUT */

.press-layout{
    display:grid;
    grid-template-columns:1fr 1.1fr;
    gap:42px;
    align-items:stretch;
}


/* LEFT */

.press-left{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:470px;
}

.press-title{
    font-size:14px;
    font-weight:600;
    color:#fff;
}

.press-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.press-item{
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding-bottom:8px;
}

.press-item:last-child{
    border-bottom:none;
    padding-bottom:0;
}

.press-item h3{
    font-size:13px;
    font-weight:600;
    color:#fff;
    margin-bottom:2px;
}

.press-item p{
    font-size:11px;
    color:rgba(255,255,255,0.55);
    line-height:1.6;
}


/* RIGHT */

.press-image{
    width:100%;
    height:470px;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        #d6d6d9,
        #bfc1c7
    );
    transition:0.4s ease;
}

.press-image:hover{
    transform:scale(1.02);
}


/* RESPONSIVE */

@media(max-width:850px){

    .press-layout{
        grid-template-columns:1fr;
    }

    .press-left{
        min-height:auto;
        gap:40px;
    }

    .press-image{
        height:320px;
    }

}

@media(max-width:600px){

    body{
        padding:18px;
    }

    .press-card{
        padding:18px;
    }

    .press-image{
        height:240px;
    }

}

</style>
</head>

<body>

<section class="press-card">

    <div class="press-layout">

        <!-- LEFT -->
        <div class="press-left">

            <div class="press-title">
                Press
            </div>


            <div class="press-list">

                <div class="press-item">
                    <h3>Cover Feature</h3>
                    <p>Lorem ipsum, January 2020</p>
                </div>

                <div class="press-item">
                    <h3>Podcast Episode</h3>
                    <p>Lorem ipsum, November 2019</p>
                </div>

                <div class="press-item">
                    <h3>Feature</h3>
                    <p>Lorem ipsum, December 2018</p>
                </div>

                <div class="press-item">
                    <h3>Interview</h3>
                    <p>Lorem ipsum June 2018</p>
                </div>

            </div>

        </div>


        <!-- RIGHT -->
        <div class="press-image" style="background-image: url('https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

    </div>

</section>

</body>
</html>
