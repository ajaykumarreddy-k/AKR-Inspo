<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Layered Portfolio Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e6e6e6;
    padding:40px;
    font-family:'Inter',sans-serif;
}

.project-card{
    width:100%;
    max-width:1150px;
    background:#f5f5f5;
    border-radius:10px;
    padding:26px;
    overflow:hidden;
}


/* LAYOUT */

.project-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:40px;
    align-items:start;
}


/* LEFT */

.project-info h1{
    font-size:18px;
    font-weight:700;
    color:#111;
    margin-bottom:4px;
}

.project-info span{
    display:block;
    font-size:13px;
    color:#777;
    margin-bottom:180px;
}

.project-info p{
    font-size:11px;
    line-height:1.8;
    color:#777;
    max-width:220px;
}


/* RIGHT */

.stack-wrapper{
    position:relative;
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* STACKED CARDS */

.stack-card{
    position:absolute;
    width:100%;
    max-width:760px;
    height:300px;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        #cfcfd3,
        #bfc1c7
    );
    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
    transition:0.4s ease;
}

.stack-card:nth-child(1){
    transform:
        translate(-70px,-50px);
    opacity:0.45;
}

.stack-card:nth-child(2){
    transform:
        translate(-35px,-25px);
    opacity:0.65;
}

.stack-card:nth-child(3){
    transform:
        translate(0px,0px);
    opacity:0.85;
}

.stack-card:nth-child(4){
    transform:
        translate(35px,25px);
    opacity:1;
}

.stack-card:hover{
    transform:
        translate(35px,10px)
        scale(1.02);
}


/* RESPONSIVE */

@media(max-width:950px){

    .project-layout{
        grid-template-columns:1fr;
    }

    .project-info span{
        margin-bottom:40px;
    }

    .stack-wrapper{
        height:340px;
    }

    .stack-card{
        height:240px;
    }

}

@media(max-width:650px){

    body{
        padding:18px;
    }

    .project-card{
        padding:18px;
    }

    .stack-wrapper{
        height:260px;
    }

    .stack-card{
        height:180px;
    }

    .stack-card:nth-child(1){
        transform:translate(-25px,-25px);
    }

    .stack-card:nth-child(2){
        transform:translate(-10px,-10px);
    }

    .stack-card:nth-child(4){
        transform:translate(10px,10px);
    }

}

</style>
</head>

<body>

<section class="project-card">

    <div class="project-layout">

        <!-- LEFT -->
        <div class="project-info">

            <h1>Project name</h1>

            <span>Client</span>

            <p>
                Lorem ipsum dolor sit amet, consectetur adipisicing elit,
                sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                Ut enim ad minim veniam, quis nostrud exercitation ullamco.
            </p>

        </div>


        <!-- RIGHT -->
        <div class="stack-wrapper">

            <div class="stack-card" style="background-image: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

            <div class="stack-card" style="background-image: url('https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

            <div class="stack-card" style="background-image: url('https://images.unsplash.com/photo-1541462608141-2f528de31e92?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

            <div class="stack-card" style="background-image: url('https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?q=80&w=800&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

        </div>

    </div>

</section>

</body>
</html>
