<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Brand Guidelines</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- FONT MATCH -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#d9d9d9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:'Space Grotesk',sans-serif;
}


/* CONTAINER */

.brand-card{
    width:100%;
    max-width:1400px;
    height:760px;
    background:#000;
    border-radius:2px;
    padding:14px 18px;
    position:relative;
    overflow:hidden;
}


/* TOP LINE */

.top-line{
    width:100%;
    height:1px;
    background:rgba(255,255,255,0.55);
    margin-bottom:12px;
}


/* HERO */

.hero{
    display:flex;
    flex-direction:column;
    gap:10px;
}


/* TITLE */

.title{
    color:#f4f1ec;
    font-size:120px;
    font-weight:700;
    line-height:0.9;
    letter-spacing:-8px;
    text-transform:none;
}


/* ICONS */

.icon-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:8px;
}

.circle{
    width:74px;
    height:74px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:700;
    transition:0.35s ease;
}

.circle:hover{
    transform:scale(1.08);
}

.green{
    background:#93f25d;
    color:#000;
}

.pink{
    background:#f66bc5;
    color:#000;
}


/* FOOTER */

.footer{
    position:absolute;
    left:18px;
    right:18px;
    bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#f4f1ec;
    font-size:13px;
    font-weight:500;
}

.footer-center{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}


/* RESPONSIVE */

@media(max-width:1100px){

    .title{
        font-size:92px;
        letter-spacing:-5px;
    }

}

@media(max-width:700px){

    .brand-card{
        height:620px;
    }

    .title{
        font-size:64px;
        letter-spacing:-3px;
    }

    .circle{
        width:58px;
        height:58px;
        font-size:32px;
    }

    .footer{
        font-size:11px;
    }

}

@media(max-width:480px){

    body{
        padding:10px;
    }

    .title{
        font-size:48px;
        line-height:0.95;
    }

}

</style>
</head>

<body>

<section class="brand-card">

    <div class="top-line"></div>


    <div class="hero">

        <h1 class="title">
            Brand<br>
            Guidelines
        </h1>


        <div class="icon-row">

            <div class="circle green">
                ↘
            </div>

            <div class="circle pink">
                B
            </div>

        </div>

    </div>



    <div class="footer">

        <div>
            Brand Guidelines
        </div>

        <div class="footer-center">
            @2023 Friends From The City
        </div>

        <div>
            NYC
        </div>

    </div>

</section>

</body>
</html>
