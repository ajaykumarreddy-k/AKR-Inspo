<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Minimal Grid Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e9e9e9;
    padding:40px;
    font-family:'Inter',sans-serif;
}

.portfolio-card{
    width:100%;
    max-width:1200px;
    background:#f6f6f6;
    border-radius:10px;
    padding:18px;
}


/* TOP */

.top-section{
    display:grid;
    grid-template-columns:1.1fr 0.6fr 1fr 1fr;
    gap:28px;
    margin-bottom:18px;
}

.project-info h1{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
    color:#111;
}

.project-info p{
    font-size:13px;
    color:#777;
}

.year{
    font-size:13px;
    color:#8a8a8a;
    padding-top:2px;
}

.text-block{
    font-size:11px;
    line-height:1.7;
    color:#5a5a5a;
}


/* GRID */

.grid-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}


/* LEFT */

.left-grid{
    display:grid;
    grid-template-rows:220px 90px;
    gap:14px;
}

.left-bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}


/* RIGHT */

.right-grid{
    display:grid;
    grid-template-rows:90px 220px;
    gap:14px;
}

.right-top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}


/* BOXES */

.box{
    background:linear-gradient(135deg,#d8d8d8,#cfcfcf);
    border-radius:8px;
    transition:0.35s ease;
}

.box:hover{
    transform:translateY(-4px);
}


/* RESPONSIVE */

@media(max-width:900px){

    .top-section{
        grid-template-columns:1fr;
        gap:18px;
    }

    .grid-layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    body{
        padding:18px;
    }

    .portfolio-card{
        padding:14px;
    }

    .left-bottom,
    .right-top{
        grid-template-columns:1fr;
    }

    .left-grid{
        grid-template-rows:180px auto;
    }

    .right-grid{
        grid-template-rows:auto 180px;
    }

}

</style>
</head>

<body>

<div class="portfolio-card">

    <!-- TOP -->
    <div class="top-section">

        <div class="project-info">
            <h1>Project name</h1>
            <p>Client</p>
        </div>

        <div class="year">
            2025
        </div>

        <div class="text-block">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit,
            sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        </div>

        <div class="text-block">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit,
            sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
        </div>

    </div>


    <!-- GRID -->
    <div class="grid-layout">

        <!-- LEFT -->
        <div class="left-grid">

            <div class="box" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

            <div class="left-bottom">
                <div class="box" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=400&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>
                <div class="box" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=400&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>
            </div>

        </div>


        <!-- RIGHT -->
        <div class="right-grid">

            <div class="right-top">
                <div class="box" style="background-image: url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=400&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>
                <div class="box" style="background-image: url('https://images.unsplash.com/photo-1472214222555-d404758b1c42?q=80&w=400&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>
            </div>

            <div class="box" style="background-image: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=600&auto=format&fit=crop'); background-size: cover; background-position: center;"></div>

        </div>

    </div>

</div>

</body>
</html>
