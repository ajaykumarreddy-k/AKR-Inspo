<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Decryption - Stage 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }
    /* Ambient glow background */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: 10%;
      left: 15%;
      pointer-events: none;
      z-index: 1;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 66, 0, 0.1) 0%, transparent 70%);
      bottom: 10%;
      right: 15%;
      pointer-events: none;
      z-index: 1;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 15, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 10;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 25px;
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    /* Number Grid Container */
    .grid-container {
      max-height: 380px;
      overflow-y: auto;
      padding-right: 8px;
      margin-bottom: 25px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 16px;
    }
    /* Scrollbar styling */
    .grid-container::-webkit-scrollbar {
      width: 6px;
    }
    .grid-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 99px;
    }
    .grid-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
    }
    .grid-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    /* Number Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
    }
    @media (max-width: 580px) {
      .grid {
        grid-template-columns: repeat(8, 1fr);
      }
    }
    @media (max-width: 440px) {
      .grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
    .num-btn {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .num-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.05);
    }
    .num-btn.error {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      animation: shake 0.4s ease;
    }
    .num-btn.success {
      background: #ff4200;
      border-color: #ff4200;
      color: #000000;
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255, 66, 0, 0.4);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .status-msg {
      min-height: 24px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ef4444;
      margin-top: 15px;
      transition: opacity 0.3s;
      opacity: 0;
    }
    .status-msg.active {
      opacity: 1;
    }
    .status-msg.passed {
      color: #10b981;
    }
    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 30px;
      color: #6b7280;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">Decryption Stage 01</div>
    <h1>Verify Secret Code</h1>
    <p class="subtitle">Choose the correct sequence key from the grid below to decrypt Stage 1.</p>

    <div class="grid-container">
      <div class="grid" id="grid">
        <!-- 1000 Buttons will be generated here -->
      </div>
    </div>

    <div class="status-msg" id="status">Verification Failed. Try again.</div>

    <a href="/links" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Abort Decryption
    </a>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    let cooldown = false;

    // Generate 1 to 1000 grid buttons
    for (let i = 1; i <= 1000; i++) {
      const btn = document.createElement('button');
      btn.className = 'num-btn';
      btn.innerText = i;
      btn.addEventListener('click', () => handleChoice(i, btn));
      grid.appendChild(btn);
    }

    function handleChoice(num, element) {
      if (cooldown) return;

      // Obfuscated formula for correct key = 200:
      // (200 * 7919) % 10007 === 2694
      const isCorrect = ((num * 7919) % 10007) === 2694;

      if (isCorrect) {
        cooldown = true;
        element.classList.add('success');
        status.innerText = "Stage 01 Verified! Redirecting to Stage 02...";
        status.className = "status-msg active passed";
        
        // Save state in session storage
        sessionStorage.setItem('sub1_passed', 'true');
        sessionStorage.setItem('sub1_num', num.toString());
        
        setTimeout(() => {
          window.location.href = '/sub2.html';
        }, 1500);
      } else {
        element.classList.add('error');
        status.innerText = "Signature mismatch. Key " + num + " rejected.";
        status.className = "status-msg active";
        
        setTimeout(() => {
          element.classList.remove('error');
        }, 500);
      }
    }
  </script>

</body>
</html>
