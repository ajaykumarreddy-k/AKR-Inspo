<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Screen Card Layout</title>
    <style>
        /* Reset default margins and set the background color */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1500FF; /* The exact blue color requested */
            overflow: hidden; /* Prevents scrolling so it perfectly locks to the screen */
        }

        /* Container to add the blue space on the left and right sides */
        .layout-container {
            width: 100%;
            height: 100%;
            padding: 0 4vw; /* Uses viewport width to keep the side margins responsive */
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center; /* Center horizontally */
        }

        /* The white shape */
        .white-card {
            background-color: #FFFFFF;
            width: 100%;
            height: 50vh; /* Exactly half of the screen's height */
            border-bottom-left-radius: 40px; /* Rounded corners matching your image */
            border-bottom-right-radius: 40px;
            flex-shrink: 0; /* Prevents it from shrinking when text is added */
        }

        /* Container for the bottom half to allow tiles to scroll smoothly */
        .bottom-section {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allows scrolling in the bottom half */
            /* Hide scrollbar for a cleaner look */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .bottom-section::-webkit-scrollbar {
            display: none;
        }

        /* The text in the bottom half */
        .bottom-text {
            width: 100%;
            display: flex;
            justify-content: flex-start; /* Aligned to the left */
            align-items: center;
            color: #000000; /* Black text */
            font-family: 'Google Sans', 'Product Sans', sans-serif; /* Requests Google Sans with fallbacks */
            font-size: clamp(6rem, 12vw, 12rem); /* Increased to be massive */
            font-weight: 900; /* Extra Bold text */
            text-align: left;
            letter-spacing: -0.05em; /* Tight letter spacing */
            margin: 20px 0;
            flex-shrink: 0;
        }

        /* --- 10000000% MATCH TILE STYLES --- */
        .tiles-grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            width: 100%;
            padding-bottom: 40px; /* Padding at the end of the scroll area */
        }

        .custom-tile {
            background-color: #D4D4D4; /* Exact match to the light gray */
            padding: 12px; /* Tighter padding to match image */
            width: 320px; /* Matched to the proportions in your image */
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1); /* Subtle definition edge */
        }

        .tile-black-area {
            background-color: #000000;
            width: 100%;
            height: 190px;
            border-radius: 8px; /* Smooth rounded corners of the black box */
            margin-bottom: 4px; /* Pulled text closer to the image */
        }

        .tile-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* Locks the button exactly to the bottom */
            margin-top: 2px;
        }

        .tile-title {
            color: #000000;
            font-family: 'Helvetica Neue', 'Google Sans', sans-serif; /* Helvetica Neue added for that specific heavy look */
            font-size: 38px;
            font-weight: 900; /* Super heavy weight */
            letter-spacing: -0.09em; /* Extremely tight tracking replicating the image */
            margin: 0;
            line-height: 0.9;
        }

        .tile-btn {
            color: #000000;
            font-family: 'Helvetica Neue', 'Google Sans', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.06em;
            border: 4px solid #000000; /* Thicker black border matched to image */
            border-radius: 30px; /* True pill shape */
            padding: 2px 18px; /* Tighter vertical, wider horizontal padding */
            line-height: 1.1;
            background: transparent;
            cursor: pointer;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <!-- The white thingy covering half the screen -->
        <div class="white-card"></div>
        
        <!-- The bottom scrollable section -->
        <div class="bottom-section">
            <!-- The text in the remaining half -->
            <div class="bottom-text">
                Akr - VID
            </div>

            <!-- The Grid for the new tiles -->
            <div class="tiles-grid">
                <!-- Tile 1 -->
                <div class="custom-tile">
                    <div class="tile-black-area"></div>
                    <div class="tile-footer">
                        <div class="tile-title">Tile Name</div>
                        <button class="tile-btn">Open</button>
                    </div>
                </div>
                
                <!-- Tile 2 -->
                <div class="custom-tile">
                    <div class="tile-black-area"></div>
                    <div class="tile-footer">
                        <div class="tile-title">Tile Name</div>
                        <button class="tile-btn">Open</button>
                    </div>
                </div>
                
                <!-- Tile 3 -->
                <div class="custom-tile">
                    <div class="tile-black-area"></div>
                    <div class="tile-footer">
                        <div class="tile-title">Tile Name</div>
                        <button class="tile-btn">Open</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
