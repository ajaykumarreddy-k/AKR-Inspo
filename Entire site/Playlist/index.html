<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Videos I Like</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="title-section">
            <h1>Music Videos<br>I Like</h1>
            <div class="buttons">
                <button class="active">List</button>
                <button>Grid</button>
                <button>About</button>
            </div>
        </div>
        <div class="by-section">
            <span>by</span>
        </div>
        <div class="name-section">
            <h1>Ajay<br>AKR</h1>
        </div>
    </header>

    <div class="table-container">
        <div class="grid-row grid-header">
            <div>Artist</div>
            <div>Composition</div>
            <div>Year</div>
            <div>Directed by</div>
            <div>Country</div>
            <div class="plus-col"></div>
        </div>
        <div id="table-body">
            <!-- Rows will be injected by script.js -->
        </div>
    </div>

    <footer>
        <div>( 2026 )</div>
        <div>[ send a recommendation ]</div>
        <div>[ credits ]</div>
    </footer>

    <script type="module" src="./script.js"></script>
</body>
</html>
