<html>
  <head>
    <title>Parallax Image Scroll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link
      href="https://fonts.cdnfonts.com/css/google-sans"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-family: 'Google Sans', 'Product Sans', sans-serif;
        letter-spacing: -0.02em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        background: #fff;
        color: #111;
        overflow-x: hidden;
      }
      .demo-section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .demo-section h1 {
        font-size: clamp(28px, 5vw, 56px);
        font-weight: 600;
        letter-spacing: -0.04em;
        margin-bottom: 8px;
        text-align: center;
      }
      .demo-section p {
        font-size: clamp(14px, 2vw, 18px);
        color: #666;
        letter-spacing: -0.02em;
        margin-bottom: 40px;
        text-align: center;
        max-width: 500px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 960px;
      }
      .card {
        aspect-ratio: 3 / 4;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #f5f5f5;
      }
      .card-label {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #fff;
        background: rgba(0,0,0,0.5);
        padding: 6px 12px;
        border-radius: 6px;
        backdrop-filter: blur(4px);
      }
      .spacer {
        height: 40vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #999;
        letter-spacing: -0.02em;
      }
    </style>
    <script type="module" crossorigin src="/assets/frammer-21st-dev-components-parallax-image-scroll-BGw2VQqw.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/client-DXEJ18IH.js">
  </head>
  <body>
    <div class="demo-section">
      <h1>Parallax Image</h1>
      <p>Scroll to see the parallax effect in action</p>
    </div>

    <div class="spacer">Scroll down to see the effect</div>

    <div id="root" style="display:flex;justify-content:center;padding:20px">
      <div class="grid" id="grid"></div>
    </div>

    <div class="spacer">—</div>

  </body>
</html>
